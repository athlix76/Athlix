name: athlix
description: Athlix mobile app (Android and iOS). Sports community for India.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.0
  intl: ^0.19.0
  in_app_purchase: ^3.2.0
  razorpay_flutter: ^1.3.7
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  package_info_plus: ^8.0.2
  # Location eligibility: device location for the distance filter (never stored)
  # and PDF proof upload (image_picker cannot pick PDFs).
  geolocator: ^13.0.1
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/athlix_icon.png
    - assets/brand/athlix_wordmark.png
    - assets/brand/athlix_mark.png
  # Bundled (SIL OFL, licences in assets/fonts): headings Montserrat, body Manrope.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-600.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-700.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-800.ttf
          weight: 800
  config:
    # iOS uses CocoaPods, not Swift Package Manager: under SwiftPM, Xcode 26+ refuses
    # SwiftyGif (pulled in by file_picker -> DKPhotoGallery) for its old Swift tools version.
    enable-swift-package-manager: false
